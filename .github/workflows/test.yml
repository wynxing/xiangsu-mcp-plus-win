name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-acl-evidence-node-${{ matrix.node }}
          path: test-results/windows-acl-evidence.json
          if-no-files-found: error
